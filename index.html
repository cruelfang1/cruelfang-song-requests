<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cruelfang Song Requests</title>
<style>
:root{--bg:#09080d;--panel:#17131f;--panel2:#211a2c;--text:#f7f3fb;--muted:#b9b0c7;--accent:#9a4dff;--border:#4a385c}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% 0,#291537 0,#120d18 38%,var(--bg) 75%);color:var(--text)}
header{text-align:center;padding:38px 20px 18px}.logo{font-size:clamp(42px,8vw,88px);font-weight:900;letter-spacing:.08em;text-shadow:0 0 18px #7f39d8}h1{margin:4px 0 8px;font-size:30px}.sub{color:var(--muted);max-width:720px;margin:auto;line-height:1.4}
.wrap{max-width:1680px;margin:auto;padding:0 20px 50px}.searchbox{margin:20px 0 28px;background:rgba(23,19,31,.95);border:1px solid var(--border);border-radius:18px;padding:16px}
input{width:100%;padding:15px;border-radius:12px;border:1px solid #5a476b;background:#100d16;color:var(--text);font-size:16px}.stats{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px;padding-top:10px}
.sections{display:grid;grid-template-columns:repeat(3,minmax(340px,1fr));gap:24px;overflow-x:auto;padding-bottom:8px}.card{background:rgba(23,19,31,.96);border:1px solid var(--border);border-radius:20px;padding:22px}.fox{width:100%;height:260px;object-fit:contain;background:#120f18;border-radius:14px}.duet-fox{object-fit:contain;display:block;width:100%;height:260px;background:#120f18;border-radius:14px}.heading{text-align:center;font-size:28px;font-weight:900;letter-spacing:.08em;margin:16px 0}.song{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-top:1px solid #33263e}.song:first-child{border-top:0}.song-title{font-weight:700}.artist{font-size:13px;color:var(--muted);margin-top:3px}button{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:white;font-weight:700;cursor:pointer}.empty{color:var(--muted);padding:12px}.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:20px}.modal.show{display:grid}.dialog{width:min(440px,100%);background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px}.dialog h2{margin-top:0}.dialog input{margin:8px 0}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}.secondary{background:#3a3044}
@media(max-width:760px){.sections{grid-template-columns:1fr}.stats{flex-direction:column}.fox{height:220px}}
</style>
</head>
<body>
<header><div class="logo">CRUELFANG</div><h1>Song Requests</h1><div class="sub">Search the song list or browse by performer. Choose a song and send it directly to the Cruelfang request queue.</div></header>
<main class="wrap">
  <div class="searchbox"><input id="search" autocomplete="off" placeholder="Search all songs by title or artist..."><div class="stats"><span id="count">Loading songs...</span><span>No Twitch API required</span></div></div>
  <div class="sections">
    <section class="card"><img class="fox" src="mr-fang.png" alt="Mr Fang"><div class="heading">MR FANG'S SOLOS</div><div id="mr-list"></div></section>
    <section class="card"><img class="fox" src="miss-fang.png" alt="Miss Fang"><div class="heading">MISS FANG'S SOLOS</div><div id="miss-list"></div></section>
    <section class="card"><img class="fox duet-fox" src="duets.png" alt="Mr Fang and Miss Fang Duet"><div class="heading">DUETS</div><div id="duet-list"></div></section>
  </div>
</main>
<div class="modal" id="modal"><div class="dialog"><h2>Request a Song</h2><div id="selected"></div><input id="requester" maxlength="40" placeholder="Your name"><div class="actions"><button class="secondary" id="cancel">Cancel</button><button id="send">Send Request</button></div><div id="message"></div></div></div>
<script>
const WORKER="https://cruelfang-song-queue.cruelfang1.workers.dev";
let songs=[], chosen=null;
const search=document.getElementById("search"), count=document.getElementById("count"), modal=document.getElementById("modal");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function norm(c){c=String(c||"").toLowerCase().replace(/[\s-]+/g,"_"); if(["mr_fang","mrfang","mr_fang_solos","mr_fang_solo"].includes(c))return"mr_fang"; if(["miss_fang","missfang","miss_fang_solos","miss_fang_solo"].includes(c))return"miss_fang"; if(["duet","duets"].includes(c))return"duet"; return c;}
function render(){
  const q=search.value.trim().toLowerCase();
  const filtered=songs.filter(s=>(s.title+" "+s.artist).toLowerCase().includes(q));
  count.textContent=`${filtered.length} of ${songs.length} songs`;
  const mr=filtered.filter(s=>norm(s.category)==="mr_fang");
  const miss=filtered.filter(s=>norm(s.category)==="miss_fang");
  const duet=filtered.filter(s=>norm(s.category)==="duet");
  fill("mr-list",mr); fill("miss-list",miss); fill("duet-list",duet);
}
function fill(id,list){
  const el=document.getElementById(id);
  el.innerHTML=list.length?list.map((s,i)=>`<div class="song"><div><div class="song-title">${esc(s.title)}</div><div class="artist">${esc(s.artist)}</div></div><button data-id="${s._id}">Request</button></div>`).join(""):'<div class="empty">No songs found.</div>';
  [...el.querySelectorAll("button[data-id]")].forEach(b=>b.onclick=()=>openRequest(songs.find(s=>String(s._id)===b.dataset.id)));
}
function openRequest(song){chosen=song; document.getElementById("selected").textContent=`${song.title} — ${song.artist}`; document.getElementById("message").textContent=""; modal.classList.add("show");}
document.getElementById("cancel").onclick=()=>modal.classList.remove("show");
document.getElementById("send").onclick=async()=>{
  const requester=document.getElementById("requester").value.trim()||"Anonymous", msg=document.getElementById("message");
  if(!chosen)return;
  msg.textContent="Sending...";
  const payload={title:chosen.title,artist:chosen.artist,requester,requestedBy:requester};
  const paths=["/request","/requests"];
  let last;
  for(const path of paths){
    try{
      const r=await fetch(WORKER+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      if(r.ok){msg.textContent="Request sent."; setTimeout(()=>modal.classList.remove("show"),900); return;}
      last=await r.text();
    }catch(e){last=e.message}
  }
  msg.textContent="Could not send request: "+(last||"Worker error");
};
(async()=>{
  try{
    const r=await fetch("./songs.json",{cache:"no-store"});
    if(!r.ok)throw new Error("songs.json returned "+r.status);
    const data=await r.json();
    if(!Array.isArray(data))throw new Error("songs.json is not an array");
    songs=data.map((s,i)=>({...s,_id:i,category:norm(s.category)}));
    render();
  }catch(e){count.textContent="Could not load songs: "+e.message;}
})();
search.addEventListener("input",render);
</script>
</body></html>
