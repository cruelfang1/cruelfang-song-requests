<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Cruelfang Song Queue</title><style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0b0810;color:#f7f3fb;padding:24px}.wrap{max-width:900px;margin:auto}.logo{text-align:center;font-size:44px;font-weight:900;letter-spacing:.08em;color:#fff;text-shadow:0 0 18px #8c44e8}h1{text-align:center}.bar{display:flex;gap:10px;justify-content:space-between;align-items:center;background:#17131f;border:1px solid #4a385c;border-radius:14px;padding:12px}.queue{margin-top:18px}.item{background:#17131f;border:1px solid #4a385c;border-radius:14px;padding:16px;margin-bottom:10px}.title{font-size:20px;font-weight:800}.meta{color:#b9b0c7;margin-top:5px;font-size:14px}.requested{margin-top:8px;color:#d8c5ff;font-weight:700}.empty{text-align:center;color:#b9b0c7;padding:40px}button{border:0;border-radius:9px;padding:10px 14px;background:#9a4dff;color:#fff;font-weight:700;cursor:pointer}
</style></head><body><div class="wrap"><div class="logo">CRUELFANG</div><h1>Song Request Queue</h1><div class="bar"><span id="status">Loading queue...</span><button id="refresh">Refresh</button></div><div class="queue" id="queue"></div></div><script>
const WORKER="https://cruelfang-song-queue.cruelfang1.workers.dev";const status=document.getElementById("status"),queue=document.getElementById("queue");
function esc(s){return String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function sources(x){return [x,x?.body,x?.data,x?.message,x?.request,x?.song,x?.payload].filter(Boolean);}
function pick(x,keys,fallback=""){for(const src of sources(x))for(const k of keys){const v=src?.[k];if(v!==undefined&&v!==null&&String(v).trim()!=="")return v;}return fallback;}
async function load(){status.textContent="Loading queue...";queue.innerHTML="";let data,last="";for(const path of ["/queue","/requests"]){try{const r=await fetch(WORKER+path,{cache:"no-store"});if(r.ok){data=await r.json();break;}last=await r.text();}catch(e){last=e.message;}}const list=Array.isArray(data)?data:(data&&Array.isArray(data.queue)?data.queue:(data&&Array.isArray(data.requests)?data.requests:[]));if(!data){status.textContent="Could not load queue: "+(last||"Worker error");return;}status.textContent=`${list.length} request${list.length===1?"":"s"}`;queue.innerHTML=list.length?list.map(x=>{const title=pick(x,["title","songTitle","song_name","songName"],"Unknown song");const artist=pick(x,["artist","songArtist","artistName"],"Unknown artist");const requester=pick(x,["requester","requestedBy","requested_by","requesterName","requestedByName","name","user","username","displayName"],"");return `<div class="item"><div class="title">${esc(title)}</div><div class="meta">${esc(artist)}</div>${requester?`<div class="requested">Requested by: ${esc(requester)}</div>`:""}</div>`;}).join(""):'<div class="empty">The request queue is empty.</div>';}
document.getElementById("refresh").onclick=load;load();setInterval(load,10000);
</script></body></html>
