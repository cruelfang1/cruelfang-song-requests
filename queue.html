<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cruelfang Song Queue</title>
<style>
:root{--bg:#0b0810;--panel:#17131f;--border:#4a385c;--text:#f7f3fb;--muted:#b9b0c7;--accent:#9a4dff;--danger:#7d3148}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);padding:24px}.wrap{max-width:1000px;margin:auto}.logo{text-align:center;font-size:clamp(2.5rem,6vw,4.5rem);font-weight:900;letter-spacing:.08em;text-shadow:0 0 18px #8c44e8}h1{text-align:center;margin:10px 0 20px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px}.hidden{display:none}.bar{display:flex;gap:10px;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px}.queue{margin-top:18px}.item{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px}.title{font-size:20px;font-weight:800}.meta{color:var(--muted);margin-top:5px;font-size:14px}.requested{margin-top:8px;color:#d8c5ff;font-weight:700}.empty{text-align:center;color:var(--muted);padding:40px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.controls input{flex:1;min-width:220px;padding:11px;border-radius:9px;border:1px solid var(--border);background:#100d16;color:#fff}button{border:0;border-radius:9px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.danger{background:var(--danger)}.secondary{background:#3a3044}.status{color:var(--muted);margin-top:10px}
</style></head>
<body><div class="wrap">
<div class="logo">CRUELFANG</div><h1>Song Request Queue</h1>
<div class="panel" id="adminPanel"><div class="controls"><input id="adminKey" type="password" placeholder="Admin password (needed to clear the queue)"><button id="openQueue">Open Queue</button></div><div class="status" id="adminStatus">You can view the queue without an admin password. Enter the password to enable Clear Queue.</div></div>
<div class="bar" style="margin-top:18px"><span id="status">Loading queue...</span><div class="controls"><button id="refresh">Refresh</button><button id="clear" class="danger">Clear Queue</button></div></div>
<div class="queue" id="queue"></div>
</div><script>
const WORKER="https://cruelfang-song-queue.cruelfang1.workers.dev";
const status=document.getElementById("status"),queue=document.getElementById("queue"),adminKey=document.getElementById("adminKey");
let key=sessionStorage.getItem("cruelfangAdminKey")||"";adminKey.value=key;
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function sources(x){return [x,x?.body,x?.data,x?.message,x?.request,x?.song,x?.payload].filter(Boolean);}
function pick(x,keys,fallback=""){for(const src of sources(x))for(const k of keys){const v=src?.[k];if(v!==undefined&&v!==null&&String(v).trim()!=="")return v;}return fallback;}
async function api(path,opts={}){const headers={...(opts.headers||{})};if(key)headers["X-Admin-Key"]=key;return fetch(WORKER+path,{...opts,headers});}
async function load(){status.textContent="Loading queue...";queue.innerHTML="";let data,last="";for(const path of ["/queue","/requests"]){try{const r=await api(path,{cache:"no-store"});if(r.ok){data=await r.json();break;}last=await r.text();}catch(e){last=e.message;}}const list=Array.isArray(data)?data:(data&&Array.isArray(data.queue)?data.queue:(data&&Array.isArray(data.requests)?data.requests:[]));if(!data){status.textContent="Could not load queue: "+(last||"Worker error");return;}status.textContent=`${list.length} request${list.length===1?"":"s"}`;queue.innerHTML=list.length?list.map((x,i)=>{const title=pick(x,["title","songTitle","song_name","songName"],"Unknown song");const artist=pick(x,["artist","songArtist","artistName"],"Unknown artist");const requester=pick(x,["requester","requestedBy","requested_by","requesterName","requestedByName","name","user","username","displayName"],"");return `<div class="item"><div class="title">${i+1}. ${esc(title)}</div><div class="meta">${esc(artist)}</div><div class="requested">Requested by: ${esc(requester||"Unknown")}</div></div>`;}).join(""):'<div class="empty">The request queue is empty.</div>';}
document.getElementById("openQueue").onclick=()=>{key=adminKey.value.trim();if(key)sessionStorage.setItem("cruelfangAdminKey",key);else sessionStorage.removeItem("cruelfangAdminKey");document.getElementById("adminStatus").textContent=key?"Admin key saved for this browser session. Clear Queue is enabled.":"No admin key entered. Queue can still be viewed, but clearing may be rejected.";load();};
document.getElementById("refresh").onclick=load;
document.getElementById("clear").onclick=async()=>{if(!key){alert("Enter the admin password first, then click Open Queue.");adminKey.focus();return;}if(!confirm("Clear the entire song request queue? This cannot be undone."))return;const b=document.getElementById("clear");b.disabled=true;b.textContent="Clearing...";try{let ok=false,last="";for(const path of ["/queue","/requests"]){const r=await api(path,{method:"DELETE"});if(r.ok){ok=true;break;}last=await r.text();}if(!ok)throw new Error(last||"Worker rejected the clear request.");await load();}catch(e){alert("Could not clear queue: "+e.message);}finally{b.disabled=false;b.textContent="Clear Queue";}};
load();setInterval(load,10000);
</script></body></html>
